name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""

    runs-on: ${{ matrix.os }}

    env:
      LEMON_STORE_ID: ${{ secrets.LEMON_STORE_ID }}
      LEMON_PRODUCT_ID: ${{ secrets.LEMON_PRODUCT_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Tidy modules
        run: go mod tidy

      - name: Build (Windows)
        if: matrix.goos == 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: go build -ldflags "-s -w -H windowsgui -X 'klip/internal/license.storeID=${{ secrets.LEMON_STORE_ID }}' -X 'klip/internal/license.productID=${{ secrets.LEMON_PRODUCT_ID }}'" -o klip-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/klip

      - name: Build (Unix)
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: go build -ldflags "-s -w -X 'klip/internal/license.storeID=${{ secrets.LEMON_STORE_ID }}' -X 'klip/internal/license.productID=${{ secrets.LEMON_PRODUCT_ID }}'" -o klip-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/klip

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        run: Compress-Archive -Path klip-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} -DestinationPath klip-${{ matrix.goos }}-${{ matrix.goarch }}.zip
        shell: pwsh

      - name: Package (Linux)
        if: matrix.goos == 'linux'
        run: tar czf klip-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz klip-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

      - name: Package macOS .app
        if: matrix.goos == 'darwin'
        run: |
          set -euo pipefail
          APP="Klip.app"
          VER="${GITHUB_REF_NAME#v}"

          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "klip-darwin-arm64" "$APP/Contents/MacOS/klip"
          chmod +x "$APP/Contents/MacOS/klip"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>CFBundleName</key><string>Klip</string>
          <key>CFBundleDisplayName</key><string>Klip</string>
          <key>CFBundleIdentifier</key><string>app.klip-it.klip</string>
          <key>CFBundleExecutable</key><string>klip</string>
          <key>CFBundleIconFile</key><string>klip</string>
          <key>CFBundleVersion</key><string>${VER}</string>
          <key>CFBundleShortVersionString</key><string>${VER}</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          <key>LSUIElement</key><true/>
          <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # Build .icns from the 1024x1024 source icon
          SRC="cmd/klip/assets/klip-icon.png"
          ICONSET="klip.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z "$s" "$s" "$SRC" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            sips -z "$((s*2))" "$((s*2))" "$SRC" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/klip.icns"

          # Ad-hoc sign (no Developer ID). Lets the binary run on arm64; users still
          # clear quarantine once on first launch (see README).
          codesign --force --sign - "$APP/Contents/MacOS/klip"
          codesign --force --sign - "$APP"
          codesign --verify --verbose "$APP"

          # Zip preserving the bundle structure/metadata (plain zip mangles it).
          ditto -c -k --keepParent "$APP" "klip-darwin-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: klip-${{ matrix.goos }}-${{ matrix.goarch }}
          path: klip-${{ matrix.goos }}-${{ matrix.goarch }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum klip-* > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*

  # Updates the Homebrew tap formula (url + sha256) to the new tag.
  # Skipped until the HOMEBREW_TAP_TOKEN secret is set, so it never fails a
  # release before the tap exists. Requires a PAT with contents+PR write on
  # the PatrykDz95/homebrew-tap repo.
  bump-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Bump Homebrew tap formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        uses: dawidd6/action-homebrew-bump-formula@v8
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: PatrykDz95/homebrew-tap
          formula: klip
          tag: ${{ github.ref_name }}
          no_fork: true

  # Updates the Scoop manifest (version + url + sha256) in this repo and pushes
  # it back to master. The manifest lives here (not a separate bucket), so the
  # default GITHUB_TOKEN with contents:write is enough — no PAT needed.
  bump-scoop:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - name: Download Windows artifact
        uses: actions/download-artifact@v6
        with:
          name: klip-windows-amd64
          path: dist

      - name: Update Scoop manifest
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/klip-windows-amd64.zip"
          HASH="$(sha256sum dist/klip-windows-amd64.zip | awk '{print $1}')"

          jq --arg v "$VER" --arg u "$URL" --arg h "$HASH" \
            '.version = $v | .architecture["64bit"].url = $u | .architecture["64bit"].hash = $h' \
            packaging/scoop/klip.json > klip.json.tmp
          mv klip.json.tmp packaging/scoop/klip.json

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet -- packaging/scoop/klip.json; then
            echo "Scoop manifest already current"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/scoop/klip.json
          git commit -m "chore(scoop): bump manifest to ${GITHUB_REF_NAME} [skip ci]"
          git push origin HEAD:master